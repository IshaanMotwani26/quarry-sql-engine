[package]
name = "quarry"
version = "0.1.0"
edition = "2021"
description = "A SQL query engine written from scratch"
default-run = "quarry"

[lib]
path = "src/lib.rs"

[[bin]]
name = "quarry"
path = "src/main.rs"

[[bin]]
name = "quarry-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "quarry-server"
path = "src/bin/server.rs"

[dependencies]
